# MySQL 계정 및 앱의 외부 DB 접속정보 : 운영 시 SealedSecrets 등으로 교체하고 비밀번호 반드시 변경
apiVersion: v1
kind: Secret
metadata:
  name: egovframe-portal-site-template-mysql
  labels:
    app.kubernetes.io/name: egovframe-portal-site-template-mysql
    app.kubernetes.io/part-of: egovframe-template
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root1234
  MYSQL_DATABASE: pst
  MYSQL_USER: pst
  MYSQL_PASSWORD: pst01
---
# 앱 Deployment 가 envFrom 으로 참조 (globals.properties 보다 우선, Globals.DbType → GLOBALS_DBTYPE)
# PostgreSQL : GLOBALS_DBTYPE=postgres, GLOBALS_URL=jdbc:log4jdbc:postgresql://<host>:5432/pst
apiVersion: v1
kind: Secret
metadata:
  name: egovframe-portal-site-template-db
  labels:
    app.kubernetes.io/name: egovframe-portal-site-template
    app.kubernetes.io/part-of: egovframe-template
type: Opaque
stringData:
  GLOBALS_DBTYPE: mysql
  GLOBALS_URL: jdbc:log4jdbc:mysql://egovframe-portal-site-template-mysql:3306/pst
  GLOBALS_USERNAME: pst
  GLOBALS_PASSWORD: pst01
  GLOBALS_HSQL_AUTOINIT: "false"
