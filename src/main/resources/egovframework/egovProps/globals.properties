#-----------------------------------------------------------------------
# globals.properties : 시스템 공통 설정
#  - key = value 형식, key 에는 공백·한글 사용 불가
#  - 디렉토리 구분자는 '/' 사용, value 끝에 공백을 두지 않음
#  - 모든 값은 환경변수(GLOBALS_DBTYPE 등, 대문자·'.'→'_') 또는 -D 시스템 프로퍼티로 덮어쓸 수 있음
#-----------------------------------------------------------------------

# 운영서버 타입 (WINDOWS, UNIX)
Globals.OsType = WINDOWS

# G4C 연결용 IP
Globals.LocalIp = 127.0.0.1

# DB 타입 (hsql, mysql, postgres, oracle, altibase, tibero, cubrid, maria, goldilocks) : datasource·mapper 선택
Globals.DbType = hsql
Globals.UserName = pst
Globals.Password = pst01

# mysql
Globals.DriverClassName = net.sf.log4jdbc.DriverSpy
Globals.Url = jdbc:log4jdbc:mysql://127.0.0.1:3306/pst

# oracle
