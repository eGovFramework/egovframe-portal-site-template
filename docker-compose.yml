# egovframe-portal-site-template 로컬 실행 (Docker Compose, 내장 HSQLDB)
# Dockerfile 이 멀티 스테이지로 WAR 를 직접 빌드하므로 `mvn package` 없이 `docker compose up -d --build` 로 실행합니다.
# MySQL 사용 : docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
# 헬스체크는 Dockerfile 의 HEALTHCHECK 를 사용합니다.
# 접속 URL : http://localhost:8080/

services:
  egovframe-portal-site-template:
    build:
      context: .
      dockerfile: Dockerfile
    image: egovframe-portal-site-template:${APP_VERSION:-5.1.0}
    container_name: egovframe-portal-site-template
    ports:
      - "8080:8080"
    environment:
      # JVM 옵션
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError}
      # 첨부파일 ID 암호화 키 (Globals.File.algorithmKey → GLOBALS_FILE_ALGORITHMKEY) : 운영 시 반드시 변경
      GLOBALS_FILE_ALGORITHMKEY: ${GLOBALS_FILE_ALGORITHMKEY:-change-this-file-key}
    volumes:
      # 첨부파일 저장 경로 (Globals.fileStorePath)
      - upload-data:/upload
    restart: unless-stopped

volumes:
  upload-data:
